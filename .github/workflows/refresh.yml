name: 刷新政府债数据

# 触发条件：
#   1) 定时：每天自动跑（见下方 cron）
#   2) 手动：在仓库 Actions 页面点 "Run workflow" 立即触发，便于测试
on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC 时间。
    # '0 1 * * *' = 每天 UTC 01:00 = 北京时间每天 09:00
    # 如需调整：北京时间 = UTC + 8；例如想北京时间 20:00 则写 '0 12 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch: {}

# 允许 workflow 把生成的 JSON 写回本仓库（关键，否则 push 会被拒）
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成最新数据集
        run: node gen_gov_bond_data.js

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gov_bond_month_end.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新政府债数据 $(date -u +'%Y-%m-%d')"
            git push
          fi
